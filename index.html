<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abash — Find a place that feels right</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/abash.css">
</head>
<body>
<div id="app">
  <div class="wrap" style="padding:80px 0;text-align:center">
    <div class="logo" style="font-size:32px">Abash<i style="color:#7d3540;font-style:normal">.</i></div>
    <p class="soft" style="margin-top:12px">Loading demo…</p>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
if (!window.ABASH_LISTINGS || !window.Abash) {
  document.getElementById("app").innerHTML =
    '<div class="wrap empty" style="margin:60px auto"><h3 class="h3">Scripts failed to load</h3>' +
    "<p>Open this folder via a local server or GitHub Pages — or keep <code>js/</code> next to this file.</p></div>";
} else {
  Abash.init();
}
</script>
</body>
</html>
